name: Deploy progress dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths: ['tracker/completed.tsv', 'port/patches/**', 'port/pruned.txt', 'dashboard/**']

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sample historical module coverage for the rate chart.
      - name: Regenerate dashboard data from tracker files
        run: python3 dashboard/generate_data.py
      - name: Refresh PR #120 contributor counts from GitHub (keeps the committed file on failure)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 dashboard/generate_pr120_contributors.py || true
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - name: Wait for the uploaded artifact to appear in the Pages deployment API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          for attempt in {1..20}; do
            err_file=$(mktemp)
            if out=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
              --jq '.artifacts[] | select(.name == "github-pages" and (.expired | not)) | .id' 2>"$err_file"); then
              rm -f "$err_file"
              if printf '%s\n' "$out" | grep -Fxq "$ARTIFACT_ID"; then
                exit 0
              fi
            else
              err=$(cat "$err_file")
              rm -f "$err_file"
              printf '%s\n' "$err" >&2
              if printf '%s\n' "$err" | grep -qiE 'rate limit|HTTP 403|HTTP 429'; then
                echo "GitHub API rate limit hit while polling artifacts; waiting briefly and proceeding to deploy-pages." >&2
                sleep 10
                exit 0
              fi
            fi
            sleep 3
          done
          echo "The uploaded Pages artifact did not become visible within one minute." >&2
          exit 1
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Allow Pages artifact metadata to settle
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
